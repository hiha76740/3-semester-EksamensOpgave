name: FrontendKiosk CI

on:
  push:
    branches:
      - main
    paths:
      - "VidensVejen/src/VidensVejen.Kiosk.Web/**"
      - "VidensVejen/src/Shared/**"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "VidensVejen/VidensVejen.slnx"
  TEST_PROJECT_PATH: "VidensVejen/tests/VidensVejen.Kiosk.Web.Tests/VidensVejen.Kiosk.Web.Tests.csproj"

jobs:
  Build-And-Test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore

      - name: Test Domain
        run: dotnet test --project ${{ env.DOMAIN_PROJECT_PATH }}
          --configuration Release
          --no-restore
          --no-build
          --verbosity normal
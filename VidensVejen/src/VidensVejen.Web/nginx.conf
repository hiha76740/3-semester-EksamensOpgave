server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/frontend_admin.crt;
    ssl_certificate_key /etc/nginx/certs/frontend_admin.key;

    root /usr/share/nginx/html;
    index index.html;

    # Framework-filer skal findes på disken
    location /_framework/ {
        try_files $uri =404;
    }

    # Docker DNS slår YARP op, når Nginx modtager et API-kald.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $yarp http://VidensVejen-Proxy:8080;

    # Behold API-præfikset, så YARP kan vælge rute og fjerne det.
    location ~ ^/(auth-api|authuser-api|permissions-api|users-api|exhibitions-api|quizzes-api|images-api|images/themes)(/|$) {
        client_max_body_size 6m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass $yarp;
    }

    # Blazor håndterer selv sine sider og routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

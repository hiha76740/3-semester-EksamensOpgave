services:

# -------- Frontend Admin --------

  VidensVejen-Frontend-Admin:
    image: ghcr.io/hiha76740/vidensvejen-frontend-admin:latest
    restart: unless-stopped
    ports:
        - 8090:80
        - 8091:443
    networks:
        - frontend-admin-net
        
        #SKAL LAVES!!!
    volumes:
        - ./certs:/etc/nginx/certs:ro
        
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

# -------- Frontend Kiosk --------

  VidensVejen-Frontend-Kiosk:
    image: ghcr.io/hiha76740/vidensvejen-frontend-kiosk:latest
    restart: unless-stopped
    ports:
        - 8190:80
        - 8191:443
    networks:
        - frontend-kiosk-net
        
        #SKAL LAVES!!!
    volumes:
        - ./certs:/etc/nginx/certs:ro
        
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

# -------- Proxy --------

  VidensVejen-Proxy:
    image: ghcr.io/hiha76740/vidensvejen-proxy:latest
    restart: unless-stopped
    networks:
        - frontend-admin-net
        - frontend-kiosk-net
        - backend-net
        
    environment:
        ASPNETCORE_URLS: "http://+:8080"
        Jwt__Key: "${JWT_KEY}"
        Jwt__Issuer: "${JWT_ISSUER}"
        Jwt__Audience: "${JWT_AUDIENCE}"
        
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
  
 # -------- User DB --------
 
  mssql-UserDb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: "${USERDB_SA_PASSWORD}"
      MSSQL_PID: Developer
    volumes:
      - mssql-UserDb-data:/var/opt/mssql
    restart: unless-stopped
    ports:
        - 127.0.0.1:9001:1433
    networks:
        - user-db-net
 
 # -------- User Service --------
 
  VidensVejen-UserService:
    depends_on:
      - mssql-UserDb
    image: ghcr.io/hiha76740/vidensvejen-userservice:latest
      
    restart: unless-stopped
        
    environment:
        ASPNETCORE_URLS: "http://+:8080"
        ConnectionStrings__UserDb: "${USER_DB_CONNECTION_STRING:?Connection string mangler}"
        Jwt__Key: "${JWT_KEY}"
        Jwt__Issuer: "${JWT_ISSUER}"
        Jwt__Audience: "${JWT_AUDIENCE}"
        
    networks:
        - backend-net
        - user-db-net

    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
  
  VidensVejen-UserService-dapr:
    image: daprio/daprd:1.18.0
    command:
      - "./daprd"
      - "--app-id"
      - "userservice"
      - "--app-port"
      - "8080"
      - "--app-protocol"
      - "http"
      - "--placement-host-address"
      - "placement:50006"
      - "--scheduler-host-address"
      - "scheduler:50007"
      - "--resources-path"
      - "/components"
    depends_on:
      - VidensVejen-UserService
      - placement
      - scheduler
      - kafka-broker
    volumes:
      - "./components:/components:ro"
    network_mode: "service:VidensVejen-UserService"
    restart: unless-stopped  
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  
  # -------- AuthUser Db --------
  
  mssql-AuthUserDb:

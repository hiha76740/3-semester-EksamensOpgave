# -------- Dapr Services --------    

  placement:
    image: daprio/placement:1.18.0
    command: ["./placement", "--port", "50006"]
    restart: unless-stopped
    networks:
        - backend-net

  scheduler:
    image: daprio/scheduler:1.18.0
    command: ["./scheduler", "--port", "50007", "--etcd-data-dir", "/data"]
    user: root
    volumes:
      - dapr-scheduler-data:/data
    restart: unless-stopped
    networks:
        - backend-net

# -------- watchtower --------    

  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_CLEANUP: "true"
    command: --label-enable
    networks:
        - updates-net

# -------- kafka --------            

  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped
    networks:
        - backend-net

volumes:
    mssql-UserDb-data:
    mssql-AuthUserDb-data:
    mssql-ExhibitionDb-data:
    mssql-GameDb-data:
    mssql-ImageDb-data:
    mssql-StatisticsDb-data:
    VidensVejen-Images-Themes:
    dapr-scheduler-data:
    
networks:
    frontend-admin-net:
        driver: bridge
    
    frontend-kiosk-net:
        driver: bridge
    
    backend-net:
        driver: bridge
    
    user-db-net:
        driver: bridge
    
    auth-db-net:
        driver: bridge
    
    exhibition-db-net:
        driver: bridge
        
    game-db-net:
        driver: bridge
    
    image-db-net:
        driver: bridge
    
    statistics-db-net:
        driver: bridge
    
    updates-net:
        driver: bridge